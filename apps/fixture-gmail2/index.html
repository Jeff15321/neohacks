<!doctype html>
<html><head><meta charset="utf-8"><title>HardMail — Inbox</title>
<style>
  /* Gmail-realistic: obfuscated class names, table-based list, aria affordances */
  body { margin:0; font:13px/1.4 arial,sans-serif; color:#202124; background:#fff; }
  .G-atb { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid #e5e5e5; }
  .T-I { font:13px arial; padding:6px 12px; border:1px solid #dadce0; background:#fff; border-radius:4px; cursor:pointer; }
  .nH { max-width:1100px; margin:0 auto; }
  .zA { display:table-row; border-bottom:1px solid #edf2f9; cursor:pointer; }
  .zA.zE { font-weight:bold; }
  .yX, .y2, .bog { display:table-cell; padding:8px 10px; white-space:nowrap; overflow:hidden; }
  .xY { color:#5f6368; font-size:12px; text-align:right; }
  .adn { padding:16px 24px; max-width:900px; margin:0 auto; }
  .hP { font-size:18px; font-weight:400; margin:4px 0 8px; }
  .gD { font-weight:bold; }
  .go { color:#5f6368; }
  .a3s { padding:14px 0; white-space:pre-wrap; border-top:1px solid #eee; margin-top:10px; }
  .ams { font:13px arial; color:#202124; padding:6px 12px; border:1px solid #dadce0; display:inline-block; border-radius:4px; cursor:pointer; margin-top:10px; }
  .Am { min-height:80px; border:1px solid #cfcfcf; padding:8px; margin-top:8px; outline:none; border-radius:4px; }
  .vh { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:8px 16px; border-radius:4px; font-size:12px; }
  .aap { padding:12px; border:1px solid #eee; margin:8px 0; }
  [hidden]{display:none!important;}
</style></head>
<body>
  <div class="G-atb" role="toolbar" aria-label="Main">
    <span class="gb_d">HardMail</span>
    <button class="T-I" aria-label="Compose">Compose</button>
    <button class="T-I" id="drafts-nav">Drafts (<span id="dcount">0</span>)</button>
  </div>
  <div class="nH" role="main"><div id="app"></div></div>
  <div class="vh" id="toast" hidden>Draft saved</div>
  <script src="app.js"></script>
</body></html>
