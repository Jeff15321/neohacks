<!doctype html>
<html><head><meta charset="utf-8"><title>NetMail — Inbox</title>
<style>
  /* NetMail — fixture whose UI is driven by REAL network calls to
     /fixture-api/*, so the extension's network observation + replay can be
     tested end-to-end. */
  body { margin:0; font:13px/1.4 arial,sans-serif; color:#202124; background:#fff; }
  #nm-toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid #e5e5e5; }
  .T-I { font:13px arial; padding:6px 12px; border:1px solid #dadce0; background:#fff; border-radius:4px; cursor:pointer; }
  .nH { max-width:1100px; margin:0 auto; }
  table.list { border-collapse:collapse; width:100%; }
  tr.zA { border-bottom:1px solid #edf2f9; cursor:pointer; }
  tr.zA.zE { font-weight:bold; }
  td { padding:8px 10px; }
  .adn { padding:16px 24px; max-width:900px; margin:0 auto; }
  .hP { font-size:18px; font-weight:400; margin:4px 0 8px; }
  .a3s { padding:14px 0; white-space:pre-wrap; border-top:1px solid #eee; margin-top:10px; }
  .vh { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:8px 16px; border-radius:4px; font-size:12px; }
  form.cmp { padding:16px 24px; max-width:640px; display:flex; flex-direction:column; gap:10px; }
  form.cmp input, form.cmp textarea { font:13px arial; padding:8px; border:1px solid #cfcfcf; border-radius:4px; }
  form.cmp textarea { min-height:120px; }
  .draft-item { padding:12px; border:1px solid #eee; margin:8px 0; }
  .err { color:#c5221f; padding:12px; }
  [hidden]{display:none!important;}
</style></head>
<body>
  <div id="nm-toolbar" role="toolbar" aria-label="Main">
    <span class="gb_d">NetMail</span>
    <button class="T-I" id="compose-btn" aria-label="Compose">Compose</button>
    <button class="T-I" id="inbox-btn">Inbox</button>
    <button class="T-I" id="drafts-btn">Drafts (<span id="dcount">0</span>)</button>
  </div>
  <div class="nH" role="main"><div id="app"></div></div>
  <div class="vh" id="toast" hidden></div>
  <script src="app.js"></script>
</body></html>
