<!doctype html><html><head><meta charset="utf-8"><title>Widget AI</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; color: #202124; }
  #root { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; font-weight: 600; display:flex; justify-content:space-between; align-items:center;}
  header .be { font-weight: 400; font-size: 11px; color: #5f6368; }
  #widgets { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 2px; font-size: 13px; }
  .meta { color: #5f6368; font-size: 11px; margin-bottom: 6px; word-break: break-all; }
  .status { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px; background: #eee; margin-left: 6px; }
  .status.running { background: #fef7e0; } .status.completed { background: #e6f4ea; }
  .status.failed { background: #fce8e6; } .status.ready { background: #e8f0fe; }
  .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 5px 12px; border-radius: 14px; border: 1px solid #dadce0; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #f6f8fc; border-radius: 6px; padding: 8px; font-size: 11px; overflow: auto; max-height: 240px; }
  .log { font-size: 11px; color: #5f6368; margin-top: 6px; max-height: 120px; overflow-y: auto; }
  .log div { padding: 1px 0; }
  #composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #e0e0e0; }
  #composer textarea { flex: 1; resize: none; font: inherit; padding: 8px; border: 1px solid #dadce0; border-radius: 8px; height: 56px; }
  .hint { font-size: 11px; color: #80868b; padding: 0 14px 10px; }
  .err { color: #c5221f; font-size: 12px; }
  .net { background: #fafbfd; }
  .netop { border-top: 1px solid #eee; padding: 4px 0; }
  .netop:first-of-type { border-top: 0; }
  .netline { display: flex; gap: 6px; align-items: baseline; cursor: pointer; font-size: 11px; }
  .netline b { min-width: 42px; color: #5f6368; }
  .netline b.mut { color: #1a73e8; }
  .mono { font-family: ui-monospace, monospace; }
  .netline .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .netline .st.ok { color: #188038; } .netline .st.bad { color: #c5221f; }
  .netline .trig { color: #80868b; font-size: 10px; white-space: nowrap; }
  .netline .badge { background: #e8f0fe; color: #1a73e8; border-radius: 6px; padding: 0 5px; font-size: 9px; }
  .netdetail { padding: 4px 0 4px 48px; }
  .netdetail pre { max-height: 120px; margin: 2px 0; }
</style></head><body><div id="root"></div><script src="sidepanel.js"></script></body></html>
