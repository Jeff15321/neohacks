<!doctype html>
<html><head><meta charset="utf-8"><title>CineBase — Browse</title>
<style>
  body { margin:0; font:14px/1.45 system-ui, sans-serif; color:#111; background:#f5f5f1; }
  header.site-header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#121212; color:#fff; }
  header.site-header a { color:#f5c518; text-decoration:none; font-weight:600; }
  main { max-width:900px; margin:24px auto; background:#fff; border-radius:8px; padding:24px; }
  li { margin:6px 0; }
</style></head>
<body>
  <header class="site-header" role="banner"><a href="index.html">CineBase</a><nav aria-label="Site"><a href="watchlist.html">Watchlist</a></nav></header>
  <main role="main"><h1>Browse movies</h1><ul id="all"></ul></main>
  <script src="movies.js"></script>
  <script>
    for (const [id, m] of Object.entries(window.CINEBASE)) {
      const li = document.createElement('li'); const a = document.createElement('a');
      a.href = 'movie.html?id=' + encodeURIComponent(id); a.textContent = m.title + ' (' + m.year + ')';
      li.appendChild(a); document.getElementById('all').appendChild(li);
    }
  </script>
</body></html>
