<!doctype html>
<html><head><meta charset="utf-8"><title>CineBase — Your Watchlist</title>
<style>
  /* CineBase watchlist page: a different page where a "My saved movies" widget lists WidgetAI.db data. */
  body { margin:0; font:14px/1.45 system-ui, sans-serif; color:#111; background:#f5f5f1; }
  header.site-header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#121212; color:#fff; }
  header.site-header a { color:#f5c518; text-decoration:none; font-weight:600; }
  .logo { background:#f5c518; color:#000 !important; padding:2px 8px; border-radius:4px; font-weight:800 !important; }
  .layout { max-width:1000px; margin:24px auto; display:grid; grid-template-columns: 1fr 320px; gap:20px; }
  main.watchlist-main, aside.sidebar { background:#fff; border-radius:8px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .empty-state { color:#666; }
</style></head>
<body>
  <header class="site-header" role="banner">
    <a class="logo" href="index.html">CineBase</a>
    <nav role="navigation" aria-label="Site"><a href="index.html">Browse</a><a href="watchlist.html">Watchlist</a></nav>
  </header>
  <div class="layout">
    <main class="watchlist-main" role="main">
      <h1>Your Watchlist</h1>
      <p class="empty-state">CineBase's own watchlist is empty. Movies you save with widgets live in your personal data store.</p>
    </main>
    <aside id="watchlist-sidebar" class="sidebar" role="complementary" aria-label="Sidebar">
      <h2>Lists</h2>
      <p class="empty-state">No lists yet.</p>
    </aside>
  </div>
</body></html>
